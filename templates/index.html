<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hashtag Generator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <h1 class="title">✨ Hashtag Generator</h1>
    <p class="subtitle">Enter your social media post and get instant hashtags</p>

    <div class="grid">
      <!-- Left side -->
      <section class="input-panel">
        <h2>Input Text</h2>
        <textarea id="post" placeholder="Type or paste your post here..."></textarea>

        <div class="controls">
          <label>Number of hashtags:
            <input id="count" type="number" min="1" max="20" value="8" />
          </label>
          <button id="generate" class="btn primary">Generate</button>
          <button id="clear" class="btn secondary">Clear</button>
        </div>
      </section>

      <!-- Right side -->
      <section class="output-panel">
        <h2>Generated Hashtags</h2>
        <div id="tags" class="tags">
          <p class="placeholder">Paste text and click Generate</p>
        </div>
        <button id="copyAll" class="btn secondary full">Copy All Hashtags</button>
      </section>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
